name: Build & Publish Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.3.0)'
        required: false
        default: 'v1.3.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js for Web Security Tests
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Web Security & Logic Tests
        run: |
          node test/web_test_runner.js

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Run Flutter Unit Tests & Static Analysis
        run: |
          cd mobile
          flutter analyze
          flutter test

      - name: Build Release APK
        run: |
          cd mobile
          flutter build apk --release --no-tree-shake-icons

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=v1.3.0" >> $GITHUB_OUTPUT
          fi

      - name: Prepare APK for Artifact & Release
        run: |
          mkdir -p release-output
          TAG="${{ steps.vars.outputs.TAG_NAME }}"
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "release-output/DeenIslam-${TAG}.apk"

      - name: Upload APK to GitHub Artifacts (Backup Download)
        uses: actions/upload-artifact@v4
        with:
          name: DeenIslam-Android-APK
          path: release-output/*.apk

      - name: Create GitHub Release & Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: "DeenIslam Mobile App ${{ steps.vars.outputs.TAG_NAME }}"
          body: |
            ## 📱 দ্বীন ইসলাম (DeenIslam) - Official Android Release (${{ steps.vars.outputs.TAG_NAME }})

            Android ফোনে সরাসরি ইনস্টল করার জন্য নিচের **`DeenIslam-${{ steps.vars.outputs.TAG_NAME }}.apk`** ফাইলটি ডাউনলোড করুন।

            ---

            ### 🚀 v1.3.0 রিলিজের নতুন সংযোজন (ওয়েব পোর্টালের সাথে পূর্ণাঙ্গ সামঞ্জস্য):
            - 👶 **মুসলিম শিশুদের সুন্দর নাম (১১৫+ নাম):** ছেলে ও মেয়েদের অর্থবহ ইসলামিক নাম, আরবি ও ইংরেজি বানান, বাংলা বর্ণমালা ফিল্টার, বুকমার্ক এবং নামকরণের সুন্নাত নীতিমালা ও নিষিদ্ধ নামসমূহের তালিকা।
            - 📅 **উন্নত ইসলামিক ক্যালেন্ডার ও লাইভ কাউন্টডাউন:** আজকের হিজরি তারিখ, চাঁদ দেখা সমন্বয় (অফসেট -২ থেকে +২ দিন), রমজান-ঈদ-আরাফাহর লাইভ কাউন্টডাউন, মাসিক দিনপঞ্জি (আইয়ামে বিজ ও নিষিদ্ধ দিন চিহ্নিত) এবং দ্বি-মুখী হিজরি-গ্রেগরিয়ান কনভার্টার।
            - 🔑 **অফিসিয়াল পার্মানেন্ট কীস্টোর ও সিগনেচার স্কিম (v1 + v2):** পূর্ববর্তী সংস্করণ থেকে সরাসরি নিরবচ্ছিন্ন আপডেট সাপোর্ট।
            - 📂 **২০টি পূর্ণাঙ্গ সেবা ব্রাউজার:** ইবাদত, কুরআন ও জ্ঞান, এবং টুলস ক্যাটাগরিতে সকল সেবা।

            ---

            ### ✨ সম্পূর্ণ ফিচারসমূহ:
            - 📖 **আল-কুরআনুল কারীম:** পূর্ণাঙ্গ ১১৪টি সূরা, আরবি-বাংলা অনুবাদ, নেটিভ অডিও তিলাওয়াত ও অফলাইন ক্যাশিং।
            - 🗺️ **সীরাতুন্নবী (ﷺ) বিশ্বকোষ:** ইন্টারেক্টিভ সীরাত মানচিত্র ও কালানুক্রমিক টাইমলাইন (৫৭০–৬৩২ খ্রি.), ৫০ প্রজন্মের বংশলতিকা, আহলে বাইত ও পবিত্র পরিবার, সাহাবী ডিরেক্টরি এবং গাযওয়া ও সারিয়্যাহ।
            - 📚 **হাদিস শরীফ পাঠাগার:** সিহাহ সিত্তাহ ও মুয়াত্তা মালিক (৭টি হাদিস গ্রন্থ), অধ্যায়ভিত্তিক ব্রাউজিং ও অফলাইন সংরক্ষণ।
            - 🧭 **লাইভ কিবলা কম্পাস:** হার্ডওয়্যার ম্যাগনেটোমিটার সেন্সর ভিত্তিক রিয়েল-টাইম কিবলা কম্পাস।
            - 🗓️ **হিজরি ক্যালেন্ডার ও ইসলামিক দিবস:** গুরুত্বপূর্ণ ইসলামিক দিবস এবং আইয়ামে বীজ ও নফল রোজার তালিকা।
            - 🤲 **হিসনুল মুসলিম, ৬ কালিমা ও আল্লাহর ৯৯ নাম:** বিশুদ্ধ হাদিস রেফারেন্স ও ফজিলতসহ প্রতিদিনের দোয়া ও যিকির।
            - 🕋 **নামাজ শিক্ষা, রমজান গাইড (৩০ রোজা ট্র্যাকার), হজ্জ ও উমরাহ গাইড এবং যাকাত ক্যালকুলেটর।**
          files: |
            release-output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
