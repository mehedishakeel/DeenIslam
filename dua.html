        title: "দো'আয়ে মাসূরা",
        arabic: "اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي ظُلْمًا كَثِيرًا، وَلَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ، فَاغْفِرْ لِي مَغْفِرَةً مِنْ عِنْدِكَ وَارْحَمْنِي إِنَّكَ أَنْتَ الْغَفُورُ الرَّحِيمُ",
        transliteration: "আল্লাহুম্মা ইন্নী যালামতু নাফসী যুলমান কাছী-রাঁও ওয়ালা ইয়াগফিরুয যুনূবা ইল্লা- আন্তা, ফাগফির লী মাগফিরাতাম মিন ‘ইনদিকা ওয়ারহামনী, ইন্নাকা আন্তাল গাফূরুর রাহীম।",
        translation: "হে আল্লাহ! আমি আমার নিজের ওপর অনেক জুলুম করেছি। আর আপনি ছাড়া কেউ গুনাহ মাফ করতে পারে না। অতএব আপনি নিজ অনুগ্রহে আমাকে ক্ষমা করে দিন এবং আমার প্রতি দয়া করুন। নিশ্চয়ই আপনি অতীব ক্ষমাশীল, পরম দয়ালু।",
        reference: "সহীহ বুখারী: ৮৩৪",
        count: 1,
        note: "নামাজে দুরুদ পড়ার পর সালাম ফেরানোর পূর্বে পাঠ্য।"
      },
      // 18. Subhanallahi wa Bihamdihi
      {
        id: "tasbih-100",
        category: "morning_evening",
        title: "১০০ বার পাঠে সমুদ্রের ফেনা সমতুল্য গুনাহ মাফের তাসবীহ",
        arabic: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ",
        transliteration: "সুবহা-নাল্লা-হি ওয়া বিহামদিহী।",
        translation: "আল্লাহর পবিত্রতা ঘোষণা করছি তাঁর প্রশংসার সাথে।",
        reference: "সহীহ বুখারী: ৬৪০৫",
        count: 100,
        note: "রাসূলুল্লাহ (সা.) বলেছেন: যে ব্যক্তি দিনে ১০০ বার এটি বলবে, তার সব গুনাহ ক্ষমা করা হবে, যদিও তা সমুদ্রের ফেনা সমান হয়।"
      }
    ];

    let currentCategory = 'all';
    let searchQuery = '';

    // Repetition counter states
    const tapCounts = {};

    function renderDuas() {
      const container = document.getElementById('duas-list');
      const emptyState = document.getElementById('empty-state');
      
      const filtered = duasData.filter(d => {
        const matchesCat = currentCategory === 'all' || d.category === currentCategory;
        const matchesQuery = !searchQuery || 
          d.title.toLowerCase().includes(searchQuery) ||
          d.translation.toLowerCase().includes(searchQuery) ||
          d.transliteration.toLowerCase().includes(searchQuery) ||
          d.arabic.includes(searchQuery);
        return matchesCat && matchesQuery;
      });

      if (filtered.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      container.innerHTML = filtered.map(d => {
        const countKey = d.id;
        if (tapCounts[countKey] === undefined) tapCounts[countKey] = 0;
        const currentCount = tapCounts[countKey];
        const isDone = currentCount >= d.count;
        const bookmarkKey = `dua_${d.id}`;
        const isBookmarked = window.isBookmarked ? window.isBookmarked(bookmarkKey) : false;

        return `
          <div class="bg-white dark:bg-slate-900 p-6 md:p-8 rounded-2xl border border-stone-200/90 dark:border-slate-800 hover:border-emerald-500/40 transition-all duration-200 relative group" id="card-${d.id}">
            
            <!-- Card Header -->
            <div class="flex justify-between items-start gap-3 mb-5">
              <div>
                <span class="inline-block text-[11px] font-bold text-emerald-700 dark:text-emerald-300 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200/60 dark:border-emerald-800/40 px-2.5 py-1 rounded-md uppercase tracking-wider mb-2">
                  ${getCategoryName(d.category)}
                </span>
                <h2 class="text-lg md:text-xl font-bold text-slate-900 dark:text-white leading-snug">${d.title}</h2>
              </div>
              
              <!-- Action Buttons -->
              <div class="flex items-center space-x-1.5 shrink-0">
                <button onclick="handleDuaBookmark(event, '${d.id}')" class="p-2 rounded-lg border border-stone-200 dark:border-slate-700 text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 dark:hover:bg-emerald-950/40 transition-colors bookmark-btn" data-key="${bookmarkKey}" title="বুকমার্ক">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="${isBookmarked ? 'currentColor' : 'none'}" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
                  </svg>
                </button>
                <button onclick="copyDua('${d.id}')" class="p-2 rounded-lg border border-stone-200 dark:border-slate-700 text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 dark:hover:bg-emerald-950/40 transition-colors" title="কপি করুন">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5H6a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                  </svg>
                </button>
              </div>
            </div>

            <!-- Arabic Text -->
            <div class="text-right my-5 p-5 bg-emerald-50/40 dark:bg-emerald-950/20 rounded-xl border border-emerald-500/20 dark:border-emerald-900/30">
              <p class="font-arabic text-2xl md:text-3xl leading-[2.3] text-slate-900 dark:text-emerald-50" dir="rtl">${d.arabic}</p>
            </div>

            <!-- Transliteration -->
            <div class="mb-4">
              <p class="text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-1">উচ্চারণ</p>
              <p class="text-slate-700 dark:text-slate-300 text-sm md:text-base leading-relaxed italic">${d.transliteration}</p>
            </div>

            <!-- Translation -->
            <div class="mb-5 pt-4 border-t border-stone-100 dark:border-slate-800">
              <p class="text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-1">অর্থ</p>
              <p class="text-slate-800 dark:text-slate-200 text-sm md:text-base leading-relaxed font-medium">${d.translation}</p>
            </div>

            <!-- Reference & Fazilat Note -->
            ${d.note ? `
              <div class="p-3 bg-amber-50/70 dark:bg-amber-950/25 rounded-xl border border-amber-200/70 dark:border-amber-800/40 text-amber-900 dark:text-amber-200 text-xs md:text-sm mb-5 flex items-start gap-2 leading-relaxed">
                <span class="text-amber-600 font-bold shrink-0 mt-0.5">★</span>
                <span>${d.note}</span>
              </div>
            ` : ''}

            <!-- Footer: Reference & Interactive Counter -->
            <div class="flex flex-wrap items-center justify-between gap-3 pt-4 border-t border-stone-100 dark:border-slate-800">
              <span class="text-xs font-semibold text-slate-500 dark:text-slate-400 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 mr-1.5 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                </svg>
                ${d.reference}
              </span>

              <!-- Counter Controls -->
              <div class="flex items-center space-x-1.5">
                <button onclick="resetDuaCounter('${d.id}')" class="w-8 h-8 rounded-lg border border-stone-200 dark:border-slate-700 text-slate-400 hover:text-red-500 hover:border-red-300 flex items-center justify-center text-xs transition-colors" title="কাউন্টার রিসেট">
                  ↺
                </button>
                <button onclick="incrementDuaCounter('${d.id}', ${d.count})" 
                  class="flex items-center space-x-2 px-3 py-1.5 rounded-lg font-bold text-xs md:text-sm transition-all ${
                    isDone 
                      ? 'bg-emerald-600 text-white shadow-xs' 
                      : 'bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border border-emerald-200/60 dark:border-emerald-800/60 hover:bg-emerald-100'
                  }">
                  <span class="w-5 h-5 rounded-md bg-white dark:bg-slate-800 text-emerald-700 dark:text-emerald-300 flex items-center justify-center font-bold text-xs shadow-xs">
                    ${window.toBengaliNumerals(currentCount)}
                  </span>
                  <span>/ ${window.toBengaliNumerals(d.count)} ${isDone ? '✓' : ''}</span>
                </button>
                <button onclick="speakDua('${d.id}')" class="w-8 h-8 rounded-lg border border-amber-200 dark:border-amber-800/40 bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-300 hover:bg-amber-100 dark:hover:bg-amber-900/40 flex items-center justify-center text-xs transition-colors" title="আরবি উচ্চারণ শুনুন">
                  🔊
                </button>
              </div>
            </div>

          </div>
        `;
      }).join('');
    }

    window.resetDuaCounter = (id) => {
      tapCounts[id] = 0;
      renderDuas();
    };

    window.speakDua = (id) => {
      const d = duasData.find(item => item.id === id);
      if (!d) return;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(d.arabic);
        utterance.lang = 'ar-SA';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
        if (window.showToast) window.showToast('দো\'আ পড়া হচ্ছে...');
      } else {
        if (window.showToast) window.showToast('অডিও সাপোর্ট নেই');
      }
    };

    function getCategoryName(cat) {
      const names = {
        morning_evening: "সকাল ও সন্ধ্যা",
        daily_life: "দৈনন্দিন জীবন",
        prayer: "নামাজ ও সালাত",
        forgiveness: "ক্ষমা ও তাওবা",
        quranic: "রব্বানা দো'আ",
        hardship: "বিপদ ও আরোগ্য"
      };
      return names[cat] || "দো'আ";
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-tab').forEach(b => {
        if (b.getAttribute('data-cat') === cat) {
          b.className = "cat-tab px-4 py-2 rounded-lg font-bold text-xs md:text-sm whitespace-nowrap transition-all bg-emerald-600 text-white border border-emerald-600 shadow-xs";
        } else {
          b.className = "cat-tab px-4 py-2 rounded-lg font-bold text-xs md:text-sm whitespace-nowrap transition-all bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 hover:border-emerald-500/40 border border-stone-200/90 dark:border-slate-800";
        }
      });
      renderDuas();
    }

    function incrementDuaCounter(id, max) {
      if (tapCounts[id] === undefined) tapCounts[id] = 0;
      tapCounts[id]++;
      if (tapCounts[id] > max) {
        tapCounts[id] = 0; // Loop reset
      } else if (tapCounts[id] === max) {
        if (navigator.vibrate) navigator.vibrate([80, 40, 80]);
        if (window.showToast) window.showToast('মাশাআল্লাহ! পাঠ সম্পন্ন হয়েছে');
      } else {
        if (navigator.vibrate) navigator.vibrate(30);
      }
      renderDuas();
    }

    function copyDua(id) {
      const dua = duasData.find(d => d.id === id);
      if (!dua) return;
      const textToCopy = `${dua.title}\n\n${dua.arabic}\n\nউচ্চারণ: ${dua.transliteration}\n\nঅর্থ: ${dua.translation}\n\nরেফারেন্স: ${dua.reference}\n(দ্বীন ইসলাম - deenislam.org)`;
      window.copyToClipboard(textToCopy);
    }

    function handleDuaBookmark(event, id) {
      const dua = duasData.find(d => d.id === id);
      if (!dua) return;
      const key = `dua_${dua.id}`;
      const data = {
        key: key,
        type: 'dua',
        subType: getCategoryName(dua.category),
        title: dua.title,
        arabic: dua.arabic,
        text: dua.translation,
        url: `dua.html#card-${dua.id}`
      };
      const isAdded = window.toggleBookmark(data);
      document.querySelectorAll(`.bookmark-btn[data-key="${key}"]`).forEach(btn => {
        const svg = btn.querySelector('svg');
        if (svg) svg.setAttribute('fill', isAdded ? 'currentColor' : 'none');
      });
    }

    const searchInput = document.getElementById('dua-search');
    const clearBtn = document.getElementById('clear-search');

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      if (searchQuery) clearBtn.classList.remove('hidden');
      else clearBtn.classList.add('hidden');
      renderDuas();
    });

    function clearSearch() {
      searchInput.value = '';
      searchQuery = '';
      clearBtn.classList.add('hidden');
      renderDuas();
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('count-all').innerText = window.toBengaliNumerals(duasData.length);
      renderDuas();
    });
  </script>
</body>
</html>
