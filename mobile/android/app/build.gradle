plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.mehedishakeel.deenislam"
    compileSdk = 34
    ndkVersion = "25.1.8937393"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId = "com.mehedishakeel.deenislam"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            def keyFile = file('deenislam-release.jks')
            if (keystorePropertiesFile.exists() && keystoreProperties['storeFile']) {
                def propFile = file(keystoreProperties['storeFile'])
                if (!propFile.exists()) {
                    propFile = rootProject.file(keystoreProperties['storeFile'])
                }
                if (propFile.exists()) {
                    keyFile = propFile
                }
            }
            if (keyFile.exists()) {
                keyAlias (keystoreProperties['keyAlias'] ?: 'deenislam')
                keyPassword (keystoreProperties['keyPassword'] ?: 'deenislam2026')
                storeFile keyFile
                storePassword (keystoreProperties['storePassword'] ?: 'deenislam2026')
            } else {
                signingConfig = signingConfigs.debug
            }
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}
