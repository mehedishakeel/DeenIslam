name: deen_islam
description: "MISHKAT - Modern Islamic Client-Side Portal & Native Mobile Application"
publish_to: "none"
version: 1.0.3+4

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  font_awesome_flutter: ^10.7.0
  adhan_dart: ^2.0.1
  geolocator: ^12.0.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/

# geolocator_android >=4.6.2 needs a newer Flutter Gradle plugin than 3.24.3.
dependency_overrides:
  geolocator_android: 4.6.1
