          {id: 114, name: "আন-নাস", verses: 6, type: "মক্কী"},
        ];

    const grid = document.getElementById('quran-grid');
    const paginationControls = document.getElementById('pagination-controls');
    const searchInput = document.querySelector('input[type="text"]');

    let currentPage = 1;
    const itemsPerPage = 20;
    let currentSurahs = [...surahs];

    // Global Audio Player State
    let currentAudio = null;
    let currentPlayingSurahId = null;
    let currentAyahs = [];
    let currentAyahIndex = 0;
    let isPaused = false;
    let selectedReciter = localStorage.getItem('selected_reciter') || 'ar.alafasy';

    const reciterSelect = document.getElementById('reciter-select');

    async function initReciters() {
        try {
            const response = await fetch('https://api.alquran.cloud/v1/edition?format=audio&language=ar');
            const data = await response.json();
            if (data.code === 200) {
                // Filter for common/high-quality reciters to keep the list manageable, 
                // or just show all. Let's show all available Arabic audio editions.
                reciterSelect.innerHTML = data.data.map(r => 
                    `<option value="${r.identifier}" ${r.identifier === selectedReciter ? 'selected' : ''}>${r.englishName}</option>`
                ).join('');
            }
        } catch (error) {
            console.error("Error fetching reciters:", error);
        }
    }
    initReciters();

    reciterSelect.addEventListener('change', (e) => {
        selectedReciter = e.target.value;
        localStorage.setItem('selected_reciter', selectedReciter);
        if (currentPlayingSurahId) {
            // If something is playing, stop it so next play uses new reciter
            stopGlobalAudio();
        }
    });

    let matchedAyahs = {}; // Map of Surah ID -> Ayah Number

    function renderSurahs() {
      grid.innerHTML = '';
      
      const startIndex = (currentPage - 1) * itemsPerPage;
      const endIndex = startIndex + itemsPerPage;
      const paginatedSurahs = currentSurahs.slice(startIndex, endIndex);

      if (paginatedSurahs.length === 0) {
        grid.innerHTML = '<div class="col-span-full text-center py-10 text-slate-500">কোন সূরা খুঁজে পাওয়া যায়নি।</div>';
        renderPagination(0);
        return;
      }

      paginatedSurahs.forEach(surah => {
        const card = document.createElement('div');
        card.className = "bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-100 dark:border-slate-800 shadow-sm hover:shadow-xl hover:border-emerald-200 transition-all duration-300 group relative";
        
        const isCurrentlyPlaying = currentPlayingSurahId === surah.id;
        const targetAyah = matchedAyahs[surah.id];
        const surahLink = targetAyah ? `surah.html?id=${surah.id}&ayah=${targetAyah}` : `surah.html?id=${surah.id}`;
        
        const bookmarkKey = `quran_surah_${surah.id}`;
        const isBookmarked = window.isBookmarked(bookmarkKey);

        card.innerHTML = `
          <div class="flex justify-between items-center mb-4">
            <div class="w-12 h-12 bg-emerald-50 dark:bg-emerald-900/30 text-primary rounded-2xl flex items-center justify-center font-bold text-lg group-hover:bg-primary group-hover:text-white transition-all">
              ${toBengaliNumerals(surah.id)}
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="handleBookmark(event, ${JSON.stringify(surah).replace(/"/g, '&quot;')})" class="p-3 bg-emerald-50 dark:bg-emerald-900/30 text-primary rounded-xl hover:bg-primary hover:text-white transition-all shadow-sm bookmark-btn" data-key="${bookmarkKey}">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="${isBookmarked ? 'currentColor' : 'none'}" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" /></svg>
                </button>
                <button onclick="playSurah(event, ${surah.id}, '${surah.name}')" class="p-3 bg-emerald-50 dark:bg-emerald-900/30 text-primary rounded-xl hover:bg-primary hover:text-white transition-all shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path id="btn-icon-${surah.id}" fill-rule="evenodd" d="${isCurrentlyPlaying && !isPaused ? 'M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z' : 'M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z'}" clip-rule="evenodd" />
                    </svg>
                </button>
                <span class="px-3 py-1 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400 text-xs font-bold rounded-full">${surah.type}</span>
            </div>
          </div>
          <a href="${surahLink}" class="block">
            <h3 class="text-xl font-bold text-slate-800 dark:text-white mb-2 group-hover:text-primary transition-colors">${surah.name}</h3>
            <p class="text-slate-500 dark:text-slate-400 text-sm">আয়াত: ${toBengaliNumerals(surah.verses)}</p>
            ${targetAyah ? `<p id="ayat-preview-${surah.id}" class="text-xs text-slate-400 dark:text-slate-500 mt-2 leading-relaxed line-clamp-2">আয়াত লোড হচ্ছে...</p>` : ''}
            <div class="mt-4 text-primary font-bold text-sm flex items-center opacity-0 group-hover:opacity-100 transition-all">
                ${targetAyah ? `আয়াত নম্বর ${toBengaliNumerals(targetAyah)}-এ যান` : 'বিস্তারিত পড়ুন'} <span class="ml-2">→</span>
            </div>
          </a>
        `;
        grid.appendChild(card);

        if (targetAyah) {
          fetch(`https://api.alquran.cloud/v1/ayah/${surah.id}:${targetAyah}/bn.bengali`)
            .then(r => r.json())
            .then(data => {
              if (data.code === 200) {
                const el = document.getElementById(`ayat-preview-${surah.id}`);
                if (el) el.textContent = data.data.text.substring(0, 140) + '...';
              }
            })
            .catch(() => {});
        }
      });

      renderPagination(currentSurahs.length);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function playSurah(event, id, name) {
        event.stopPropagation();
        
        if (currentPlayingSurahId === id) {
            toggleGlobalPlayer();
            return;
        }

        stopGlobalAudio();
        
        currentPlayingSurahId = id;
        document.getElementById('global-player').classList.remove('translate-y-full');
        document.getElementById('player-surah-id').innerText = toBengaliNumerals(id);
        document.getElementById('player-surah-name').innerText = `সূরা ${name}`;
        document.getElementById('player-verse-info').innerText = 'লোড হচ্ছে...';
        
        try {
            const response = await fetch(`https://api.alquran.cloud/v1/surah/${id}/${selectedReciter}`);
            const data = await response.json();
            if (data.code === 200 && data.data && data.data.ayahs) {
                currentAyahs = data.data.ayahs;
                currentAyahIndex = 0;
                startAyahPlayback();
                updateAllCardButtons();
            } else {
                alert("দুঃখিত, এই তেলাওয়াতকারীর কাছে এই সূরার অডিও পাওয়া যায়নি। অন্য তেলাওয়াতকারী চেষ্টা করুন।");
                stopGlobalAudio();
            }
        } catch (error) {
            console.error("Audio error:", error);
            alert("অডিও লোড করতে সমস্যা হচ্ছে। অনুগ্রহ করে আপনার ইন্টারনেট সংযোগ চেক করুন।");
            stopGlobalAudio();
        }
    }

    function startAyahPlayback() {
        if (currentAyahIndex >= currentAyahs.length) {
            stopGlobalAudio();
            return;
        }

        if (currentAudio) {
            currentAudio.pause();
            currentAudio.onended = null;
        }

        const ayah = currentAyahs[currentAyahIndex];
        if (!ayah || !ayah.audio) {
            currentAyahIndex++;
            startAyahPlayback();
            return;
        }

        currentAudio = new Audio(ayah.audio);

        const progress = Math.round((currentAyahIndex + 1) / currentAyahs.length * 100);
        document.getElementById('player-progress').style.width = `${progress}%`;
        document.getElementById('player-verse-info').innerText = `আয়াত: ${toBengaliNumerals(currentAyahIndex + 1)} / ${toBengaliNumerals(currentAyahs.length)}`;
        
        currentAudio.onended = () => {
            currentAyahIndex++;
            startAyahPlayback();
        };

        currentAudio.play().catch(err => {
            console.error("Playback error:", err);
            currentAyahIndex++;
            startAyahPlayback();
        });
        setPlayPauseUI(true);
    }

    function skipAyah(dir) {
        if (currentAyahs.length === 0) return;
        const next = currentAyahIndex + dir;
        if (next < 0 || next >= currentAyahs.length) return;
        currentAyahIndex = next;
        startAyahPlayback();
    }

    function toggleGlobalPlayer() {
        if (!currentAudio) return;
        
        if (currentAudio.paused) {
            currentAudio.play();
            isPaused = false;
            setPlayPauseUI(true);
        } else {
            currentAudio.pause();
            isPaused = true;
            setPlayPauseUI(false);
        }
        updateAllCardButtons();
    }

    function stopGlobalAudio() {
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.onended = null;
            currentAudio = null;
        }
        currentPlayingSurahId = null;
        currentAyahs = [];
        currentAyahIndex = 0;
        isPaused = false;
        
        document.getElementById('global-player').classList.add('translate-y-full');
        setPlayPauseUI(false);
        updateAllCardButtons();
    }

    function setPlayPauseUI(isPlaying) {
        const icon = document.getElementById('player-play-icon');
        if (isPlaying) {
            icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" />';
        } else {
            icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />';
        }
    }

    function updateAllCardButtons() {
        surahs.forEach(s => {
            const btnIcon = document.getElementById(`btn-icon-${s.id}`);
            if (btnIcon) {
                if (currentPlayingSurahId === s.id && !isPaused) {
                    btnIcon.setAttribute('d', 'M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z');
                } else {
                    btnIcon.setAttribute('d', 'M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z');
                }
            }
        });
    }

    document.getElementById('player-play-btn').onclick = toggleGlobalPlayer;
    document.getElementById('player-stop-btn').onclick = stopGlobalAudio;
    document.getElementById('player-prev-btn').onclick = () => skipAyah(-1);
    document.getElementById('player-next-btn').onclick = () => skipAyah(1);

    document.addEventListener('keydown', (e) => {
        if (currentAyahs.length === 0) return;
        if (e.key === 'ArrowLeft') { e.preventDefault(); skipAyah(-1); }
        if (e.key === 'ArrowRight') { e.preventDefault(); skipAyah(1); }
    });

    function renderPagination(totalItems) {
      paginationControls.innerHTML = '';
      const totalPages = Math.ceil(totalItems / itemsPerPage);
      if (totalPages <= 1) return;

      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement('button');
        btn.innerText = toBengaliNumerals(i);
        btn.className = `w-12 h-12 rounded-2xl font-bold transition-all duration-300 ${
          currentPage === i 
          ? 'bg-primary text-white shadow-lg' 
          : 'bg-white dark:bg-slate-900 text-slate-600 hover:bg-emerald-50 dark:hover:bg-emerald-900/20 border border-slate-100 dark:border-slate-800'
        }`;
        btn.onclick = () => {
          currentPage = i;
          renderSurahs();
        };
        paginationControls.appendChild(btn);
      }
    }

    // Initial render
    renderSurahs();

    // Helper to convert Bengali digits to English
    const toEnglishNumerals = (str) => {
      const bengaliDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
      return str.replace(/[০-৯]/g, d => bengaliDigits.indexOf(d));
    };

    let searchTimeout;
    
    // Search functionality
    searchInput.addEventListener('input', (e) => {
      const rawQuery = e.target.value.toLowerCase().trim();
      
      clearTimeout(searchTimeout);
      matchedAyahs = {}; // Reset matches
      
      // Fast local filter first
      const engQuery = toEnglishNumerals(rawQuery);
      const extractedNumber = parseInt(engQuery.replace(/\D/g, ''));
      
      if (!rawQuery) {
        currentSurahs = [...surahs];
        currentPage = 1;
        renderSurahs();
        return;
      }

      // Local Filter
      const localResults = surahs.filter(s => {
        const bnQuery = typeof avroPhonetic !== 'undefined' ? avroPhonetic.parse(rawQuery).toLowerCase() : '';
        const nameMatch = s.name.toLowerCase().includes(rawQuery) || (bnQuery && s.name.toLowerCase().includes(bnQuery));
        let numberMatch = false;
        if (!isNaN(extractedNumber)) {
          const idMatch = s.id === extractedNumber || s.id.toString().startsWith(extractedNumber.toString());
          const explicitAyahSearch = rawQuery.includes('আয়াত') || rawQuery.includes('ayah') || rawQuery.includes('ayat');
          const containsAyah = s.verses >= extractedNumber;
          const ayahMatch = containsAyah && (explicitAyahSearch || idMatch || nameMatch || extractedNumber > 114);
          
          if (ayahMatch) matchedAyahs[s.id] = extractedNumber;
          
          const totalVerseMatch = s.verses === extractedNumber;
          numberMatch = idMatch || ayahMatch || totalVerseMatch;
        }
        return nameMatch || numberMatch;
      });

      if (localResults.length > 0) {
        currentSurahs = localResults;
        currentPage = 1;
        renderSurahs();
      }

      // If it's a long Bengali string, perform deep search via API
      if (rawQuery.length > 3 && !extractedNumber) {
          searchTimeout = setTimeout(async () => {
              try {
                  const response = await fetch(`https://api.alquran.cloud/v1/search/${encodeURIComponent(rawQuery)}/all/bn.bengali`);
                  const data = await response.json();
                  
                  if (data.code === 200 && data.data.count > 0) {
                      const surahIds = [];
                      data.data.matches.forEach(match => {
                          surahIds.push(match.surah.number);
                          // Store the first matched ayah number for this surah
                          if (!matchedAyahs[match.surah.number]) {
                              matchedAyahs[match.surah.number] = match.numberInSurah;
                          }
                      });

                      const uniqueIds = [...new Set(surahIds)];
                      const apiResults = surahs.filter(s => uniqueIds.includes(s.id));
                      
                      const merged = [...localResults];
                      apiResults.forEach(s => {
                          if (!merged.find(m => m.id === s.id)) merged.push(s);
                      });
                      
                      currentSurahs = merged.sort((a, b) => a.id - b.id);
                      currentPage = 1;
                      renderSurahs();
                  } else if (localResults.length === 0) {
                      currentSurahs = [];
                      renderSurahs();
                  }
              } catch (error) {
                  console.error("Deep search error:", error);
              }
          }, 600);
      } else if (localResults.length === 0) {
          currentSurahs = [];
          renderSurahs();
      }
    });

    window.handleBookmark = (event, surah) => {
        event.preventDefault();
        event.stopPropagation();
        
        const key = `quran_surah_${surah.id}`;
        const data = {
            key: key,
            type: 'quran',
            subType: 'সূরা',
            id: surah.id,
            title: `সূরা ${surah.name}`,
            text: `${surah.type} | আয়াত: ${toBengaliNumerals(surah.verses)}`,
            url: `surah.html?id=${surah.id}`
        };
        
        const isAdded = window.toggleBookmark(data);
        
        // Update all buttons with this key
        document.querySelectorAll(`.bookmark-btn[data-key="${key}"]`).forEach(btn => {
            const svg = btn.querySelector('svg');
            svg.setAttribute('fill', isAdded ? 'currentColor' : 'none');
        });
    };

    // Initialize Recent Search

  </script>

</body>
</html>
