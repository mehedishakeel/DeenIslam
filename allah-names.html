        window.speechSynthesis.speak(utterance);
      } else {
        alert('আপনার ব্রাউজারে ভয়েস উচ্চারণ সুবিধা সমর্থিত নয়।');
      }
    }

    function renderNames() {
      const container = document.getElementById('names-grid');
      const emptyState = document.getElementById('empty-state');
      
      const filtered = allahNames.filter(n => {
        if (!searchQuery) return true;
        return n.transliteration.toLowerCase().includes(searchQuery) ||
               n.meaning.toLowerCase().includes(searchQuery) ||
               n.arabic.includes(searchQuery) ||
               n.desc.toLowerCase().includes(searchQuery);
      });

      document.getElementById('names-count').innerText = window.toBengaliNumerals(filtered.length);

      if (filtered.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      container.innerHTML = filtered.map((n, idx) => {
        const bookmarkKey = `allah_name_${n.id}`;
        const isBookmarked = window.isBookmarked ? window.isBookmarked(bookmarkKey) : false;

        return `
          <div class="bg-white dark:bg-slate-900 p-5 rounded-xl border border-stone-200/90 dark:border-slate-800 hover:border-emerald-500/40 hover:shadow-xs transition-all duration-200 relative group flex flex-col justify-between">
            
            <!-- Top Card Bar -->
            <div>
              <div class="flex justify-between items-center mb-3">
                <span class="w-8 h-8 rounded-lg bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 flex items-center justify-center font-bold text-xs ring-1 ring-emerald-200/60 dark:ring-emerald-800/40">
                  ${window.toBengaliNumerals(n.id)}
                </span>
                <div class="flex items-center space-x-1">
                  <button onclick="speakName('${n.arabic}')" class="p-1.5 rounded-lg border border-stone-200 dark:border-slate-700 text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 dark:hover:bg-emerald-950/40 transition-colors" title="উচ্চারণ শুনুন">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                    </svg>
                  </button>
                  <button onclick="handleNameBookmark(event, ${n.id})" class="p-1.5 rounded-lg border border-stone-200 dark:border-slate-700 text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 dark:hover:bg-emerald-950/40 transition-colors bookmark-btn" data-key="${bookmarkKey}" title="বুকমার্ক">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="${isBookmarked ? 'currentColor' : 'none'}" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
                    </svg>
                  </button>
                  <button onclick="copyName(${n.id})" class="p-1.5 rounded-lg border border-stone-200 dark:border-slate-700 text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 dark:hover:bg-emerald-950/40 transition-colors" title="কপি করুন">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5H6a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                    </svg>
                  </button>
                </div>
              </div>

              <!-- Arabic Calligraphy Box -->
              <div class="text-center my-2.5 py-3.5 px-3 bg-stone-50/80 dark:bg-slate-800/60 rounded-xl border border-stone-200/60 dark:border-slate-800/80">
                <p class="font-arabic text-3xl md:text-4xl text-slate-900 dark:text-emerald-200 font-normal leading-relaxed">${n.arabic}</p>
              </div>

              <!-- Transliteration & Meaning -->
              <div class="text-center mt-2.5">
                <h3 class="text-base font-bold text-emerald-800 dark:text-emerald-400 mb-0.5">${n.transliteration}</h3>
                <p class="text-xs font-semibold text-slate-700 dark:text-slate-200 mb-1.5">${n.meaning}</p>
                <p class="text-[11px] text-slate-500 dark:text-slate-400 leading-relaxed pt-2 border-t border-stone-100 dark:border-slate-800/60">${n.desc}</p>
              </div>
            </div>

            <!-- Action Button -->
            <div class="mt-3.5 pt-2 flex justify-center">
              <button onclick="speakName('${n.arabic}')" class="w-full inline-flex items-center justify-center gap-1.5 py-2 px-3 text-xs font-bold text-emerald-700 dark:text-emerald-300 bg-emerald-50 hover:bg-emerald-100/80 dark:bg-emerald-950/40 dark:hover:bg-emerald-900/60 rounded-lg transition-all border border-emerald-200/60 dark:border-emerald-800/40">
                <span>🔊</span>
                <span>উচ্চারণ শুনুন</span>
              </button>
            </div>

          </div>
        `;
      }).join('');
    }

    function copyName(id) {
      const name = allahNames.find(n => n.id === id);
      if (!name) return;
      const text = `${name.arabic} (${name.transliteration})\nঅর্থ: ${name.meaning}\nতাৎপর্য: ${name.desc}\n(DeenIslam - deenislam.org)`;
      window.copyToClipboard(text);
    }

    function handleNameBookmark(event, id) {
      const name = allahNames.find(n => n.id === id);
      if (!name) return;
      const key = `allah_name_${name.id}`;
      const data = {
        key: key,
        type: 'allah_name',
        subType: 'আসমাউল হুসনা',
        title: `${name.transliteration} (${name.arabic})`,
        arabic: name.arabic,
        text: `${name.meaning} - ${name.desc}`,
        url: `allah-names.html`
      };
      const isAdded = window.toggleBookmark(data);
      document.querySelectorAll(`.bookmark-btn[data-key="${key}"]`).forEach(btn => {
        const svg = btn.querySelector('svg');
        if (svg) svg.setAttribute('fill', isAdded ? 'currentColor' : 'none');
      });
    }

    const searchInput = document.getElementById('names-search');
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      renderNames();
    });

    document.addEventListener('DOMContentLoaded', () => {
      renderNames();
    });
  </script>
</body>
</html>
