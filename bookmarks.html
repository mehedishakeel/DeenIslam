<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>আপনার বুকমার্কসমূহ - DeenIslam</title>
  <link rel="icon" type="image/x-icon" href="favicon/deenislam.ico">
  <meta name="description" content="আপনার সংরক্ষিত কুরআন আয়াত, হাদিস, দো'আ, আল্লাহর নাম ও মিডিয়া বুকমার্ক।">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&family=Amiri&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { primary: '#059669', secondary: '#d97706' },
          fontFamily: { bengali: ['Noto Sans Bengali', 'sans-serif'], arabic: ['Amiri', 'serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 flex flex-col min-h-screen font-bengali transition-colors duration-300">
  <div id="navbar-placeholder"></div>

  <!-- Header -->
  <header class="py-10 md:py-14 text-center container mx-auto px-4 max-w-4xl">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-500/20 text-emerald-800 dark:text-emerald-300 text-xs font-medium mb-3">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-600 dark:bg-emerald-400"></span>
      <span>সংরক্ষিত তালিকা</span>
    </div>
    <h1 class="text-2xl md:text-4xl font-black text-slate-900 dark:text-white mb-2.5 tracking-tight">আপনার বুকমার্কসমূহ</h1>
    <p class="text-slate-500 dark:text-slate-400 text-xs md:text-sm max-w-xl mx-auto leading-relaxed">
      আপনার সংরক্ষিত সকল আয়াত, হাদিস, দো'আ ও আল্লাহর পবিত্র নাম এখানে এক নজরে দেখুন।
    </p>
  </header>

  <main class="container mx-auto px-4 md:px-6 pb-20 flex-grow max-w-5xl">
    <!-- Action Toolbar (Backup, Restore, Clear) -->
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6 bg-white dark:bg-slate-900/90 p-4 rounded-xl border border-stone-200/90 dark:border-slate-800/80 shadow-sm">
      <div class="flex items-center space-x-2 text-xs font-medium text-slate-500 dark:text-slate-400">
        <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span>
        <span>অফলাইন লোকালস্টোরেজ ব্যাকআপ</span>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <button onclick="exportBookmarksJSON()" class="px-3.5 py-1.5 bg-emerald-50 dark:bg-emerald-950/60 text-emerald-800 dark:text-emerald-300 rounded-lg font-semibold text-xs hover:bg-emerald-600 hover:text-white transition-all flex items-center space-x-1.5 border border-emerald-500/20">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
          <span>ব্যাকআপ (JSON)</span>
        </button>

        <label class="px-3.5 py-1.5 bg-stone-50 dark:bg-slate-800/60 text-slate-700 dark:text-slate-300 rounded-lg font-semibold text-xs hover:bg-stone-100 dark:hover:bg-slate-700 transition-all flex items-center space-x-1.5 cursor-pointer border border-stone-200/80 dark:border-slate-700">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
          <span>রিস্টোর (ইমপোর্ট)</span>
          <input type="file" id="import-file" accept=".json" class="hidden" onchange="importBookmarksJSON(event)">
        </label>

        <button onclick="clearAllBookmarks()" class="px-3 py-1.5 text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/30 rounded-lg font-semibold text-xs transition-all border border-rose-200 dark:border-rose-900/40">
          সব মুছুন
        </button>
      </div>
    </div>

    <!-- Category Tabs -->
    <div class="flex justify-center mb-8 overflow-x-auto no-scrollbar">
      <div class="inline-flex bg-stone-100/80 dark:bg-slate-800/60 p-1 rounded-xl border border-stone-200/80 dark:border-slate-800 space-x-1">
        <button onclick="showSection('all')" class="tab-btn px-3.5 py-1.5 rounded-lg font-semibold text-xs transition-all bg-emerald-600 text-white shadow-xs" id="tab-all">সবগুলো (<span id="count-all">০</span>)</button>
        <button onclick="showSection('quran')" class="tab-btn px-3.5 py-1.5 rounded-lg font-semibold text-xs transition-all text-slate-600 dark:text-slate-400 hover:bg-white dark:hover:bg-slate-800" id="tab-quran">কুরআন (<span id="count-quran">০</span>)</button>
        <button onclick="showSection('hadith')" class="tab-btn px-3.5 py-1.5 rounded-lg font-semibold text-xs transition-all text-slate-600 dark:text-slate-400 hover:bg-white dark:hover:bg-slate-800" id="tab-hadith">হাদিস (<span id="count-hadith">০</span>)</button>
        <button onclick="showSection('dua')" class="tab-btn px-3.5 py-1.5 rounded-lg font-semibold text-xs transition-all text-slate-600 dark:text-slate-400 hover:bg-white dark:hover:bg-slate-800" id="tab-dua">দো'আ (<span id="count-dua">০</span>)</button>
        <button onclick="showSection('allah_name')" class="tab-btn px-3.5 py-1.5 rounded-lg font-semibold text-xs transition-all text-slate-600 dark:text-slate-400 hover:bg-white dark:hover:bg-slate-800" id="tab-allah_name">আল্লাহর নাম (<span id="count-allah_name">০</span>)</button>
        <button onclick="showSection('media')" class="tab-btn px-3.5 py-1.5 rounded-lg font-semibold text-xs transition-all text-slate-600 dark:text-slate-400 hover:bg-white dark:hover:bg-slate-800" id="tab-media">মিডিয়া (<span id="count-media">০</span>)</button>
      </div>
    </div>

    <!-- Bookmarks Container -->
    <div id="bookmarks-container" class="space-y-4 max-w-4xl mx-auto"></div>

    <!-- Media Grid (Specific layout for media) -->
    <div id="media-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 hidden max-w-5xl mx-auto"></div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden text-center py-12 bg-white dark:bg-slate-900/90 rounded-2xl border border-stone-200/90 dark:border-slate-800/80 shadow-sm p-6 md:p-8 max-w-md mx-auto">
      <div class="w-12 h-12 bg-emerald-50 dark:bg-emerald-950/60 text-emerald-800 dark:text-emerald-300 rounded-xl flex items-center justify-center mx-auto mb-3 border border-emerald-500/20">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" /></svg>
      </div>
      <h3 class="text-base font-bold text-slate-900 dark:text-white">কোনো বুকমার্ক পাওয়া যায়নি</h3>
      <p class="text-slate-500 dark:text-slate-400 mt-1.5 text-xs leading-relaxed">কুরআন, হাদিস, দো'আ বা আল্লাহর নামের বুকমার্ক আইকনে ক্লিক করে সংরক্ষণ করুন।</p>
      <div class="mt-5 flex justify-center gap-2.5">
        <a href="quran.html" class="px-4 py-2 bg-emerald-600 text-white text-xs font-semibold rounded-xl hover:bg-emerald-700 transition-all">কুরআন পড়ুন</a>
        <a href="dua.html" class="px-4 py-2 bg-stone-50 dark:bg-slate-800/60 text-slate-700 dark:text-slate-300 text-xs font-semibold rounded-xl hover:bg-stone-100 transition-all border border-stone-200/80 dark:border-slate-700">দো'আ ভাণ্ডার</a>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <script src="js/components.js"></script>
  <script>
    let activeFilter = 'all';

    function updateCounts() {
      const bookmarks = JSON.parse(localStorage.getItem('deen_bookmarks') || '[]');
      const counts = {
        all: bookmarks.length,
        quran: bookmarks.filter(b => b.type === 'quran').length,
        hadith: bookmarks.filter(b => b.type === 'hadith').length,
        dua: bookmarks.filter(b => b.type === 'dua').length,
        allah_name: bookmarks.filter(b => b.type === 'allah_name').length,
        media: bookmarks.filter(b => b.type === 'media').length
      };

      for (const [key, count] of Object.entries(counts)) {
        const el = document.getElementById(`count-${key}`);
        if (el) el.innerText = window.toBengaliNumerals(count);
      }
    }

    function showSection(type) {
      activeFilter = type;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-emerald-600', 'text-white', 'shadow-xs');
        btn.classList.add('text-slate-600', 'dark:text-slate-400');
      });
      const activeBtn = document.getElementById('tab-' + type);
      if (activeBtn) {
        activeBtn.classList.add('bg-emerald-600', 'text-white', 'shadow-xs');
        activeBtn.classList.remove('text-slate-600', 'dark:text-slate-400');
      }
      loadBookmarks(type);
    }

    function loadBookmarks(type) {
      updateCounts();
      const bookmarks = JSON.parse(localStorage.getItem('deen_bookmarks') || '[]');
      const container = document.getElementById('bookmarks-container');
      const mediaContainer = document.getElementById('media-container');
      const emptyState = document.getElementById('empty-state');

      container.innerHTML = '';
      mediaContainer.innerHTML = '';

      const filtered = type === 'all' ? bookmarks : bookmarks.filter(b => b.type === type);

      if (filtered.length === 0) {
        container.classList.add('hidden');
        mediaContainer.classList.add('hidden');
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      if (type === 'media') {
        container.classList.add('hidden');
        mediaContainer.classList.remove('hidden');
        filtered.forEach(item => {
          mediaContainer.appendChild(createMediaCard(item));
        });
      } else {
        container.classList.remove('hidden');
        mediaContainer.classList.add('hidden');
        filtered.forEach(item => {
          if (item.type === 'media') {
            container.appendChild(createMediaCard(item));
          } else if (item.type === 'allah_name') {
            container.appendChild(createAllahNameCard(item));
          } else if (item.type === 'dua') {
            container.appendChild(createDuaCard(item));
          } else {
            container.appendChild(createStandardCard(item));
          }
        });
      }
    }

    function createStandardCard(item) {
      const card = document.createElement('div');
      card.className = "bg-white dark:bg-slate-900/90 p-5 md:p-6 rounded-xl shadow-sm border border-stone-200/90 dark:border-slate-800/80 relative group transition-all hover:border-emerald-500/30";
      card.innerHTML = `
        <div class="flex justify-between items-start mb-3">
          <span class="px-2.5 py-0.5 bg-emerald-50 dark:bg-emerald-950/60 text-emerald-800 dark:text-emerald-300 rounded-md text-[11px] font-semibold border border-emerald-500/20">
            ${item.subType || (item.type === 'quran' ? 'কুরআন' : 'হাদিস')}
          </span>
          <div class="flex items-center space-x-1">
            <button onclick="window.copyToClipboard('${(item.text || '').replace(/'/g, "\\'")}')" class="p-1.5 text-slate-400 hover:text-emerald-600 transition-colors rounded-lg hover:bg-stone-100 dark:hover:bg-slate-800" title="কপি করুন">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" /></svg>
            </button>
            <button onclick="removeBookmark('${item.key}')" class="p-1.5 text-rose-400 hover:text-rose-600 transition-colors rounded-lg hover:bg-rose-50 dark:hover:bg-rose-950/30" title="বুকমার্ক মুছুন">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" /></svg>
            </button>
          </div>
        </div>
        <h3 class="text-base font-bold text-slate-900 dark:text-white mb-2">${item.title}</h3>
        ${item.arabic ? `<p class="text-right text-xl md:text-2xl font-arabic leading-loose text-slate-900 dark:text-slate-100 mb-3 py-2.5 px-3 bg-stone-50/70 dark:bg-slate-800/60 rounded-lg border border-stone-200/60 dark:border-slate-700/60" dir="rtl">${item.arabic}</p>` : ''}
        <p class="text-slate-600 dark:text-slate-400 leading-relaxed mb-4 text-xs md:text-sm font-bengali-content">${item.text}</p>
        ${item.url ? `<a href="${item.url}" class="inline-flex items-center text-emerald-700 dark:text-emerald-400 font-semibold text-xs hover:underline bg-emerald-50/60 dark:bg-emerald-950/40 px-3 py-1 rounded-md border border-emerald-500/20">বিস্তারিত পড়ুন <span class="ml-1">→</span></a>` : ''}
      `;
      return card;
    }

    function createDuaCard(item) {
      const card = document.createElement('div');
      card.className = "bg-white dark:bg-slate-900/90 p-5 md:p-6 rounded-xl shadow-sm border border-stone-200/90 dark:border-slate-800/80 relative group transition-all hover:border-emerald-500/30";
      card.innerHTML = `
        <div class="flex justify-between items-start mb-3">
          <span class="px-2.5 py-0.5 bg-teal-50 dark:bg-teal-950/60 text-teal-800 dark:text-teal-300 rounded-md text-[11px] font-semibold border border-teal-500/20">
            দো'আ • ${item.subType || 'দৈনন্দিন'}
          </span>
          <div class="flex items-center space-x-1">
            <button onclick="window.copyToClipboard('${(item.arabic || '') + ' - ' + (item.text || '')}')" class="p-1.5 text-slate-400 hover:text-emerald-600 transition-colors rounded-lg hover:bg-stone-100 dark:hover:bg-slate-800" title="কপি করুন">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" /></svg>
            </button>
            <button onclick="removeBookmark('${item.key}')" class="p-1.5 text-rose-400 hover:text-rose-600 transition-colors rounded-lg hover:bg-rose-50 dark:hover:bg-rose-950/30" title="বুকমার্ক মুছুন">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" /></svg>
            </button>
          </div>
        </div>
        <h3 class="text-base font-bold text-slate-900 dark:text-white mb-2">${item.title}</h3>
        ${item.arabic ? `<p class="text-right text-xl md:text-2xl font-arabic leading-loose text-slate-900 dark:text-slate-100 mb-3 py-2.5 px-3 bg-stone-50/70 dark:bg-slate-800/60 rounded-lg border border-stone-200/60 dark:border-slate-700/60" dir="rtl">${item.arabic}</p>` : ''}
        ${item.pronunciation ? `<p class="text-xs text-slate-500 dark:text-slate-400 italic mb-2 leading-relaxed">উচ্চারণ: ${item.pronunciation}</p>` : ''}
        <p class="text-slate-600 dark:text-slate-400 text-xs md:text-sm leading-relaxed mb-3">অর্থ: ${item.text}</p>
        <div class="flex justify-between items-center pt-2.5 border-t border-stone-100 dark:border-slate-800">
          <span class="text-[11px] text-slate-400">${item.reference || ''}</span>
          <a href="dua.html" class="text-xs text-emerald-700 dark:text-emerald-400 font-semibold hover:underline">সকল দো'আ দেখুন →</a>
        </div>
      `;
      return card;
    }

    function createAllahNameCard(item) {
      const card = document.createElement('div');
      card.className = "bg-white dark:bg-slate-900/90 p-5 md:p-6 rounded-xl shadow-sm border border-stone-200/90 dark:border-slate-800/80 relative group transition-all hover:border-emerald-500/30";
      card.innerHTML = `
        <div class="flex justify-between items-start mb-3">
          <span class="px-2.5 py-0.5 bg-amber-50 dark:bg-amber-950/60 text-amber-800 dark:text-amber-300 rounded-md text-[11px] font-semibold border border-amber-500/20">
            আল্লাহর নাম • #${window.toBengaliNumerals(item.id || '')}
          </span>
          <button onclick="removeBookmark('${item.key}')" class="p-1.5 text-rose-400 hover:text-rose-600 transition-colors rounded-lg hover:bg-rose-50 dark:hover:bg-rose-950/30" title="বুকমার্ক মুছুন">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" /></svg>
          </button>
        </div>
        <div class="flex items-center justify-between mb-3">
          <div>
            <h3 class="text-lg font-bold text-slate-900 dark:text-white">${item.title}</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">${item.meaning || ''}</p>
          </div>
          <span class="font-arabic text-2xl text-emerald-700 dark:text-emerald-400 py-1.5 px-3 bg-stone-50/70 dark:bg-slate-800/60 rounded-lg border border-stone-200/60 dark:border-slate-700/60" dir="rtl">${item.arabic}</span>
        </div>
        <p class="text-slate-600 dark:text-slate-400 text-xs md:text-sm leading-relaxed mb-3">${item.text || ''}</p>
        <div class="pt-2.5 border-t border-stone-100 dark:border-slate-800 flex justify-end">
          <a href="allah-names.html" class="text-xs text-emerald-700 dark:text-emerald-400 font-semibold hover:underline">৯৯টি নামের তালিকায় যান →</a>
        </div>
      `;
      return card;
    }

    function createMediaCard(item) {
      const card = document.createElement('div');
      const thumbUrl = `https://img.youtube.com/vi/${item.id}/hqdefault.jpg`;
      card.className = "bg-white dark:bg-slate-900/90 rounded-xl overflow-hidden shadow-sm border border-stone-200/90 dark:border-slate-800/80 group hover:border-emerald-500/30 transition-all";
      card.innerHTML = `
        <div class="aspect-video relative overflow-hidden cursor-pointer" onclick="window.location.href='media.html?id=${item.id}'">
          <img src="${thumbUrl}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
          <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
            <div class="w-10 h-10 bg-emerald-600 text-white rounded-full flex items-center justify-center shadow-lg">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>
          </div>
        </div>
        <div class="p-4">
          <h3 class="font-bold text-slate-900 dark:text-white line-clamp-1 mb-3 text-xs md:text-sm">${item.title}</h3>
          <button onclick="removeBookmark('${item.key}')" class="w-full py-1.5 bg-rose-50 dark:bg-rose-950/30 text-rose-600 dark:text-rose-400 rounded-lg font-semibold text-xs hover:bg-rose-600 hover:text-white transition-all border border-rose-200 dark:border-rose-900/40">বুকমার্ক মুছুন</button>
        </div>
      `;
      return card;
    }

    function removeBookmark(key) {
      let bookmarks = JSON.parse(localStorage.getItem('deen_bookmarks') || '[]');
      bookmarks = bookmarks.filter(b => b.key !== key);
      localStorage.setItem('deen_bookmarks', JSON.stringify(bookmarks));
      showToast('বুকমার্ক মুছে ফেলা হয়েছে');
      loadBookmarks(activeFilter);
    }

    function clearAllBookmarks() {
      const bookmarks = JSON.parse(localStorage.getItem('deen_bookmarks') || '[]');
      if (bookmarks.length === 0) {
        showToast('মুছার মতো কোনো বুকমার্ক নেই');
        return;
      }
      if (confirm('আপনি কি নিশ্চিত যে আপনার সমস্ত বুকমার্ক মুছে ফেলতে চান?')) {
        localStorage.removeItem('deen_bookmarks');
        showToast('সব বুকমার্ক মুছে ফেলা হয়েছে');
        loadBookmarks(activeFilter);
      }
    }

    function exportBookmarksJSON() {
      const bookmarks = localStorage.getItem('deen_bookmarks') || '[]';
      const parsed = JSON.parse(bookmarks);
      if (parsed.length === 0) {
        showToast('সংরক্ষণ করার মতো কোনো বুকমার্ক নেই');
        return;
      }
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(parsed, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `deenislam_bookmarks_${new Date().toISOString().slice(0, 10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast('বুকমার্ক ডাউনলোড সম্পন্ন হয়েছে');
    }

    function importBookmarksJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (!Array.isArray(imported)) {
            alert('ভুল ফাইল ফরম্যাট! একটি সঠিক JSON ফাইল নির্বাচন করুন।');
            return;
          }
          let existing = JSON.parse(localStorage.getItem('deen_bookmarks') || '[]');
          const existingKeys = new Set(existing.map(b => b.key));
          let newCount = 0;

          imported.forEach(item => {
            if (item && item.key && !existingKeys.has(item.key)) {
              existing.push(item);
              existingKeys.add(item.key);
              newCount++;
            }
          });

          localStorage.setItem('deen_bookmarks', JSON.stringify(existing));
          showToast(`${window.toBengaliNumerals(newCount)}টি নতুন বুকমার্ক রিস্টোর হয়েছে!`);
          loadBookmarks(activeFilter);
        } catch (err) {
          alert('ফাইলটি পড়তে সমস্যা হয়েছে: ' + err.message);
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    // Initial load
    showSection('all');
  </script>
</body>
</html>
