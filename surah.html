          {id: 97, name: "আল-ক্বদর", verses: 5, type: "মক্কী"},
          {id: 98, name: "আল-বাইয়্যিনাহ", verses: 8, type: "মাদানী"},
          {id: 99, name: "আয-যালযালাহ", verses: 8, type: "মাদানী"},
          {id: 100, name: "আল-আদিয়াত", verses: 11, type: "মক্কী"},
          {id: 101, name: "আল-ক্বারিয়াহ", verses: 11, type: "মক্কী"},
          {id: 102, name: "আত-তাকাসুর", verses: 8, type: "মক্কী"},
          {id: 103, name: "আল-আসর", verses: 3, type: "মক্কী"},
          {id: 104, name: "আল-হুমাযাহ", verses: 9, type: "মক্কী"},
          {id: 105, name: "আল-ফীল", verses: 5, type: "মক্কী"},
          {id: 106, name: "কুরাইশ", verses: 4, type: "মক্কী"},
          {id: 107, name: "আল-মাউন", verses: 7, type: "মক্কী"},
          {id: 108, name: "আল-কাওসার", verses: 3, type: "মক্কী"},
          {id: 109, name: "আল-কাফিরুন", verses: 6, type: "মক্কী"},
          {id: 110, name: "আন-নাসর", verses: 3, type: "মাদানী"},
          {id: 111, name: "আল-লাহাব", verses: 5, type: "মক্কী"},
          {id: 112, name: "আল-ইখলাস", verses: 4, type: "মক্কী"},
          {id: 113, name: "আল-ফালাক্ব", verses: 5, type: "মক্কী"},
          {id: 114, name: "আন-নাস", verses: 6, type: "মক্কী"},
        ];

    const urlParams = new URLSearchParams(window.location.search);
    const surahId = urlParams.get('id');
    const targetAyahIndex = urlParams.get('ayah') ? parseInt(urlParams.get('ayah')) - 1 : -1;

    let currentAudio = null;
    let isPlayingFull = false;
    let isPaused = false;
    let currentVerseIndex = 0;
    let allAyahs = [];
    let activeVerseIndex = -1;
    let selectedReciter = localStorage.getItem('selected_reciter') || 'ar.alafasy';
    let repeatCount = parseInt(localStorage.getItem('quran_repeat_mode')) || 1;
    let currentVerseRepeated = 0;
    let playbackSpeed = parseFloat(localStorage.getItem('quran_speed')) || 1.0;

    function changeRepeatMode(val) {
        repeatCount = parseInt(val);
        localStorage.setItem('quran_repeat_mode', repeatCount);
        if (window.showToast) window.showToast(`লুপ সেট করা হয়েছে: ${val === '999' ? 'অবিরাম' : toBengaliNumerals(val) + ' বার'}`);
    }

    function changePlaybackSpeed(val) {
        playbackSpeed = parseFloat(val);
        localStorage.setItem('quran_speed', playbackSpeed);
        if (currentAudio) currentAudio.playbackRate = playbackSpeed;
        if (window.showToast) window.showToast(`গতি: ${toBengaliNumerals(val)}x`);
    }

    function saveLastRead(ayahIndex) {
        const surahMeta = surahs.find(s => s.id === parseInt(surahId));
        const sName = surahMeta ? surahMeta.name : `সূরা ${surahId}`;
        const lastReadData = {
            surahId: parseInt(surahId),
            surahName: sName,
            ayahNumber: ayahIndex + 1,
            timestamp: Date.now()
        };
        localStorage.setItem('deen_last_read', JSON.stringify(lastReadData));
    }

    const reciterSelect = document.getElementById('reciter-select');

    async function initReciters() {
        try {
            const response = await fetch('https://api.alquran.cloud/v1/edition?format=audio&language=ar');
            const data = await response.json();
            if (data.code === 200) {
                reciterSelect.innerHTML = data.data.map(r => 
                    `<option value="${r.identifier}" ${r.identifier === selectedReciter ? 'selected' : ''}>${r.englishName}</option>`
                ).join('');
            }
        } catch (error) {
            console.error("Error fetching reciters:", error);
        }
    }
    initReciters();

    reciterSelect.addEventListener('change', (e) => {
        selectedReciter = e.target.value;
        localStorage.setItem('selected_reciter', selectedReciter);
        stopAllAudio();
        loadSurahData();
    });

    function loadSurahData() {
        if (!surahId) return;
        fetch(`https://api.alquran.cloud/v1/surah/${surahId}/editions/quran-uthmani,bn.bengali,${selectedReciter}`)
            .then(response => response.json())
            .then(data => {
                if(data.code === 200) { 
                    renderSurah(data.data); 
                    if (targetAyahIndex >= 0) {
                        setTimeout(() => {
                            const element = document.getElementById(`verse-${targetAyahIndex}`);
                            if (element) {
                                element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                element.classList.add('ring-4', 'ring-emerald-100', 'dark:ring-emerald-900/20', 'border-primary');
                                setTimeout(() => element.classList.remove('ring-4', 'ring-emerald-100', 'dark:ring-emerald-900/20', 'border-primary'), 3000);
                            }
                        }, 500);
                    }
                }
                else { showError(); }
            })
            .catch(err => showError());
    }

    loadSurahData();

    function renderSurah(editions) {
      const arabicData = editions[0]; 
      const bengaliData = editions[1]; 
      const audioData = editions[2];
      
      const surahMeta = surahs.find(s => s.id === parseInt(surahId));
      const displayName = surahMeta ? surahMeta.name : arabicData.englishName;

      allAyahs = audioData.ayahs;

      document.getElementById('surah-name').innerText = `সূরা ${displayName}`; 
      document.getElementById('bar-surah-name').innerText = `সূরা ${displayName}`; 
      document.getElementById('surah-info').innerText = `আয়াত: ${toBengaliNumerals(arabicData.numberOfAyahs)} | ${arabicData.revelationType === 'Meccan' ? 'মক্কী' : 'মাদানী'}`;

      const container = document.getElementById('verses-container');
      container.innerHTML = ''; 

      // 1. Inject Bismillah Header
      // Every surah except Surah 9 (At-Tawbah) gets the header.
      // Note: For Surah 1 (Al-Fatiha), Bismillah IS the first verse, 
      // so we use the header but we'll handle the verse data below.
      if (parseInt(surahId) !== 9) {
          const bismDiv = document.createElement('div');
          bismDiv.className = "text-center mb-8 p-8 md:p-10 bg-emerald-50/40 dark:bg-emerald-950/20 rounded-2xl border border-emerald-500/20 dark:border-emerald-900/30 shadow-xs";
          bismDiv.innerHTML = `
            <p class="text-3xl md:text-5xl leading-loose font-arabic text-slate-900 dark:text-emerald-100 mb-3 drop-shadow-xs">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</p>
            <p class="text-slate-600 dark:text-slate-400 text-sm md:text-base font-medium">পরম করুণাময় অসীম দয়ালু আল্লাহর নামে শুরু করছি</p>
          `;
          container.appendChild(bismDiv);
      }

      arabicData.ayahs.forEach((ayah, index) => {
        let arabicText = ayah.text;
        
        // 2. Clean Up Verse Text
        // The API often includes Bismillah at the start of the first verse for many surahs.
        // We remove it from the display since we have the Header above.
        // Exception: Surah 1 (Al-Fatiha) where Bismillah is an independent verse.
        // Exception: Surah 9 (At-Tawbah) which has no Bismillah.
        if (index === 0 && parseInt(surahId) !== 1 && parseInt(surahId) !== 9) {
            arabicText = arabicText.replace("بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ", "").trim();
        }

        // For Al-Fatiha (Surah 1), the first verse IS Bismillah. 
        // Since we already showed the big header, we skip the first verse card to avoid duplication.
        if (index === 0 && parseInt(surahId) === 1) return;

        const verseCard = document.createElement('div');
        verseCard.id = `verse-${index}`;
        const bookmarkKey = `quran_verse_${surahId}_${ayah.numberInSurah}`;
        const isBookmarked = window.isBookmarked(bookmarkKey);

        verseCard.className = "verse-card bg-white dark:bg-slate-900 p-6 md:p-8 rounded-2xl border border-stone-200/90 dark:border-slate-800 hover:border-emerald-500/40 transition-all duration-200 relative group";
        
        verseCard.innerHTML = `
          <div class="flex flex-wrap justify-between items-center gap-3 mb-6 pb-4 border-b border-stone-100 dark:border-slate-800">
            <div class="flex items-center space-x-2">
              <div class="w-8 h-8 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 rounded-lg flex items-center justify-center font-bold text-xs ring-1 ring-emerald-200/60 dark:ring-emerald-800/40">
                ${toBengaliNumerals(ayah.numberInSurah)}
              </div>
              <button onclick="handleVerseBookmark(event, ${index}, ${JSON.stringify(ayah).replace(/"/g, '&quot;')}, ${JSON.stringify(bengaliData.ayahs[index]).replace(/"/g, '&quot;')})" class="inline-flex items-center space-x-1.5 px-3 py-1 rounded-lg text-xs font-semibold ${isBookmarked ? 'bg-emerald-600 text-white' : 'bg-stone-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-emerald-50 dark:hover:bg-emerald-950/40 hover:text-emerald-600'} border border-stone-200 dark:border-slate-700 transition-all bookmark-btn" data-key="${bookmarkKey}">
                <span>${isBookmarked ? '★' : '☆'}</span>
                <span>বুকমার্ক</span>
              </button>
            </div>
            
            <div class="flex items-center space-x-1.5">
              <button id="play-btn-${index}" onclick="handleVersePlay('${audioData.ayahs[index].audio}', ${index})" class="inline-flex items-center space-x-1 px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-xs active:scale-95 transition-all">
                <span id="play-icon-${index}">▶</span>
                <span>তেলাওয়াত</span>
              </button>
              <button onclick="window.copyToClipboard('${ayah.text.replace(/'/g, "\\'")}\\n\\n${bengaliData.ayahs[index].text.replace(/'/g, "\\'")}')" class="p-1.5 rounded-lg border border-stone-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 dark:hover:bg-emerald-950/40 transition-all text-xs" title="কপি করুন">
                📋
              </button>
              <button onclick="shareVerseAsImage(${index})" class="p-1.5 rounded-lg border border-stone-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 dark:hover:bg-emerald-950/40 transition-all text-xs" title="ছবি হিসেবে শেয়ার করুন">
                📤
              </button>
            </div>
          </div>
          <div class="mb-6 text-right">
            <p class="text-2xl md:text-4xl leading-[2.4] font-arabic text-slate-900 dark:text-white font-normal" dir="rtl">${arabicText}</p>
          </div>
          <div class="border-t pt-5 border-stone-100 dark:border-slate-800">
            <p class="text-slate-700 dark:text-slate-300 text-base md:text-lg leading-relaxed font-medium font-bengali-content">${bengaliData.ayahs[index].text}</p>
          </div>
        `;
        container.appendChild(verseCard);
      });
    }

    window.navigateSurah = (dir) => {
        const nextId = Math.max(1, Math.min(114, parseInt(surahId) + dir));
        window.location.href = `surah.html?id=${nextId}`;
    };

    function toggleFullSurahAudio() {
        const btn = document.getElementById('play-full-btn');
        const stopBtn = document.getElementById('stop-btn');
        const playerBar = document.getElementById('surah-player-bar');
        
        if (isPlayingFull) {
            if (isPaused) { 
                currentAudio.play(); 
                isPaused = false; 
                btn.innerHTML = `<span>⏸ বিরতি</span>`; 
                setBarPlayIcon(true);
            }
            else { 
                currentAudio.pause(); 
                isPaused = true; 
                btn.innerHTML = `<span>▶ পুনরায় শুরু</span>`; 
                setBarPlayIcon(false);
            }
        } else {
            stopAllAudio();
            isPlayingFull = true;
            isPaused = false;
            stopBtn.classList.remove('hidden');
            playerBar.classList.remove('translate-y-full');
            btn.innerHTML = `<span>⏸ বিরতি</span>`;
            setBarPlayIcon(true);
            currentVerseIndex = 0;
            
            // Check if we should play Bismillah first
            // Surah 1 already has Bismillah as Ayah 1
            // Surah 9 has no Bismillah
            const sId = parseInt(surahId);
            if (sId !== 1 && sId !== 9) {
                playBismillah();
            } else {
                playNextInFull();
            }
        }
    }

    async function playBismillah() {
        try {
            document.getElementById('bar-verse-info').innerText = "বিসমিল্লাহ...";
            // Fetch Surah 1 Ayah 1 for the selected reciter
            const response = await fetch(`https://api.alquran.cloud/v1/ayah/1:1/${selectedReciter}`);
            const data = await response.json();
            if (data.code === 200 && data.data.audio) {
                currentAudio = new Audio(data.data.audio);
                currentAudio.onended = () => {
                    playNextInFull();
                };
                currentAudio.play().catch(err => {
                    console.error("Bismillah playback failed", err);
                    playNextInFull();
                });
            } else {
                playNextInFull();
            }
        } catch (e) {
            playNextInFull();
        }
    }

    function playNextInFull() {
        if (!isPlayingFull || currentVerseIndex >= allAyahs.length) { 
            if (currentVerseIndex >= allAyahs.length) stopAllAudio();
            return; 
        }
        const ayah = allAyahs[currentVerseIndex];
        if (!ayah || !ayah.audio) {
            currentVerseIndex++;
            playNextInFull();
            return;
        }

        currentAudio = new Audio(ayah.audio);
        currentAudio.playbackRate = playbackSpeed;
        highlightVerse(currentVerseIndex);
        updateVerseButtons(currentVerseIndex, true);
        saveLastRead(currentVerseIndex);
        
        document.getElementById('bar-verse-info').innerText = `আয়াত: ${toBengaliNumerals(currentVerseIndex + 1)} / ${toBengaliNumerals(allAyahs.length)}`;
        const progress = ((currentVerseIndex + 1) / allAyahs.length) * 100;
        document.getElementById('bar-progress').style.width = `${progress}%`;

        const verseEl = document.getElementById(`verse-${currentVerseIndex}`);
        if (verseEl) {
            verseEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        currentAudio.onended = () => { 
            if (currentVerseRepeated < repeatCount - 1) {
                currentVerseRepeated++;
                currentAudio.currentTime = 0;
                currentAudio.play();
                return;
            }
            currentVerseRepeated = 0;
            updateVerseButtons(currentVerseIndex, false);
            currentVerseIndex++; 
            playNextInFull(); 
        };
        
        currentAudio.play().catch(err => {
            console.error("Playback failed:", err);
            updateVerseButtons(currentVerseIndex, false);
            currentVerseIndex++;
            playNextInFull();
        });
    }

    function handleVersePlay(url, index) {
        const playerBar = document.getElementById('surah-player-bar');
        if (activeVerseIndex === index && currentAudio && !currentAudio.paused) {
            currentAudio.pause(); updateVerseButtons(index, false);
            setBarPlayIcon(false);
        } else if (activeVerseIndex === index && currentAudio && currentAudio.paused) {
            currentAudio.play(); updateVerseButtons(index, true);
            setBarPlayIcon(true);
        } else {
            stopAllAudio();
            activeVerseIndex = index;
            currentAudio = new Audio(url);
            currentAudio.playbackRate = playbackSpeed;
            highlightVerse(index);
            updateVerseButtons(index, true);
            saveLastRead(index);
            playerBar.classList.remove('translate-y-full');
            setBarPlayIcon(true);
            
            document.getElementById('bar-verse-info').innerText = `আয়াত: ${toBengaliNumerals(index + 1)} / ${toBengaliNumerals(allAyahs.length)}`;
            
            let singleRepeated = 0;
            currentAudio.onended = () => { 
                if (singleRepeated < repeatCount - 1) {
                    singleRepeated++;
                    currentAudio.currentTime = 0;
                    currentAudio.play();
                    return;
                }
                updateVerseButtons(index, false); 
                activeVerseIndex = -1; 
                setBarPlayIcon(false); 
            };
            currentAudio.play();
            document.getElementById('stop-btn').classList.remove('hidden');
        }
    }

    function setBarPlayIcon(isPlaying) {
        const icon = document.getElementById('bar-play-icon');
        if (isPlaying) {
            icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" />';
        } else {
            icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />';
        }
    }

    function updateVerseButtons(index, isPlaying) {
        const icon = document.getElementById(`play-icon-${index}`);
        if (!icon) return;
        if (isPlaying) icon.setAttribute('d', 'M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z');
        else icon.setAttribute('d', 'M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z');
    }

    function stopAllAudio() {
        if (currentAudio) { currentAudio.pause(); currentAudio = null; }
        isPlayingFull = false; isPaused = false;
        activeVerseIndex = -1;
        const playBtn = document.getElementById('play-full-btn');
        if(playBtn) playBtn.innerHTML = `<span>▶ সম্পূর্ণ সূরা শুনুন</span>`;
        const stopBtn = document.getElementById('stop-btn');
        if(stopBtn) stopBtn.classList.add('hidden');
        const playerBar = document.getElementById('surah-player-bar');
        if(playerBar) playerBar.classList.add('translate-y-full');
        removeHighlights();
    }

    function highlightVerse(index) {
        removeHighlights();
        const activeVerse = document.getElementById(`verse-${index}`);
        if (activeVerse) activeVerse.classList.add('ring-4', 'ring-emerald-100', 'dark:ring-emerald-900/20', 'border-primary');
    }

    function removeHighlights() {
        document.querySelectorAll('.verse-card').forEach(el => el.classList.remove('ring-4', 'ring-emerald-100', 'dark:ring-emerald-900/20', 'border-primary'));
    }

    function showError() {
      document.getElementById('surah-name').innerText = "ত্রুটি হয়েছে";
      document.getElementById('verses-container').innerHTML = '<div class="text-center text-red-500 font-bold">তথ্য লোড করতে সমস্যা হচ্ছে।</div>';
    }

    window.handleVerseBookmark = (event, index, arabicAyah, bengaliAyah) => {
        const key = `quran_verse_${surahId}_${arabicAyah.numberInSurah}`;
        const surahName = document.getElementById('surah-name').innerText;

        const data = {
            key: key,
            type: 'quran',
            subType: 'আয়াত',
            title: `${surahName}: আয়াত ${toBengaliNumerals(arabicAyah.numberInSurah)}`,
            arabic: arabicAyah.text,
            text: bengaliAyah.text,
            url: `surah.html?id=${surahId}&ayah=${arabicAyah.numberInSurah}`
        };

        const isAdded = window.toggleBookmark(data);

        document.querySelectorAll(`.bookmark-btn[data-key="${key}"]`).forEach(btn => {
            const svg = btn.querySelector('svg');
            svg.setAttribute('fill', isAdded ? 'currentColor' : 'none');
        });
    };

    window.shareVerseAsImage = (index) => {
        const element = document.getElementById(`verse-${index}`);
        if (!element) return;
        
        window.showToast('ছবি তৈরি হচ্ছে...');
        
        // Get the header part to hide buttons
        const actionButtons = element.querySelector('.flex.justify-between.items-start');
        if (actionButtons) actionButtons.style.visibility = 'hidden';
        
        html2canvas(element, {
            backgroundColor: document.documentElement.classList.contains('dark') ? '#0f172a' : '#ffffff',
            scale: 3,
            useCORS: true,
            logging: false,
            borderRadius: 20
        }).then(canvas => {
            if (actionButtons) actionButtons.style.visibility = 'visible';
            
            const link = document.createElement('a');
            link.download = `DeenIslam-Ayah-${surahId}-${index + 1}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            window.showToast('ছবি ডাউনলোড সম্পন্ন হয়েছে!');
        }).catch(err => {
            if (actionButtons) actionButtons.style.visibility = 'visible';
            console.error('Sharing failed:', err);
            window.showToast('দুঃখিত, ছবি তৈরিতে সমস্যা হয়েছে।');
        });
    };
    </script>

</body>
</html>
