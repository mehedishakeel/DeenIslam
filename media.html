      { id: 'pDnDbOZ8Xhs', title: 'আলোচনা ও বয়ান - পর্ব ৯২', category: 'lecture' },
      { id: '0BtiIFHD0_s', title: 'আলোচনা ও বয়ান - পর্ব ৯৩', category: 'lecture' },
      { id: '2q98Vw3J_7I', title: 'আলোচনা ও বয়ান - পর্ব ৯৪', category: 'lecture' },
      { id: 'CMvkgt0JDiw', title: 'আলোচনা ও বয়ান - পর্ব ৯৫', category: 'lecture' },
      { id: 'kqftOcEcn_4', title: 'আলোচনা ও বয়ান - পর্ব ৯৬', category: 'lecture' },
      { id: 'LRsKMxownrU', title: 'আলোচনা ও বয়ান - পর্ব ৯৭', category: 'lecture' },
      { id: 'uA2dB2Ty2sU', title: 'আলোচনা ও বয়ান - পর্ব ৯৮', category: 'lecture' },
      { id: 'xJr8n77CkEw', title: 'আলোচনা ও বয়ান - পর্ব ৯৯', category: 'lecture' }
    ];

    const grid = document.getElementById('media-grid');
    const paginationContainer = document.getElementById('pagination-container');
    const modal = document.getElementById('video-modal');
    const modalIframe = document.getElementById('modal-iframe');
    const modalContent = document.getElementById('modal-content');
    const searchInput = document.getElementById('media-search');
    
    let currentCategory = 'all';
    let currentPage = 1;
    const itemsPerPage = 12;
    let filteredItems = [...mediaItems];

    function renderMedia() {
      grid.innerHTML = '';
      
      const startIndex = (currentPage - 1) * itemsPerPage;
      const endIndex = startIndex + itemsPerPage;
      const paginatedItems = filteredItems.slice(startIndex, endIndex);

      if (paginatedItems.length === 0) {
        document.getElementById('empty-state').classList.remove('hidden');
        paginationContainer.innerHTML = '';
        return;
      }
      document.getElementById('empty-state').classList.add('hidden');

      paginatedItems.forEach((item) => {
        const thumbUrl = `https://img.youtube.com/vi/${item.id}/hqdefault.jpg`;
        const categoryLabels = {
            'prophets': 'নবীদের জীবনী',
            'quran': 'কুরআন তেলাওয়াত',
            'lecture': 'আলোচনা'
        };
        
        const card = document.createElement('div');
        card.className = "bg-white dark:bg-slate-900/90 rounded-2xl overflow-hidden shadow-sm border border-stone-200/90 dark:border-slate-800/80 group cursor-pointer hover:border-emerald-500/40 hover:shadow-md transition-all";
        card.onclick = () => openModal(item);
        
        card.innerHTML = `
          <div class="aspect-video relative overflow-hidden">
            <img src="${thumbUrl}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
            <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                <div class="w-11 h-11 bg-emerald-600 text-white rounded-full flex items-center justify-center shadow-lg transform scale-90 group-hover:scale-100 transition-transform duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </div>
            </div>
            <div class="absolute top-3 left-3 flex flex-col space-y-2">
                <span class="px-2 py-0.5 bg-white/95 dark:bg-slate-900/95 text-[10px] font-semibold text-emerald-800 dark:text-emerald-300 rounded-md border border-stone-200/80 dark:border-slate-800">
                    ${categoryLabels[item.category]}
                </span>
            </div>
            <div class="absolute top-3 right-3">
                <button onclick="handleMediaBookmark(event, ${JSON.stringify(item).replace(/"/g, '&quot;')})" class="w-7 h-7 bg-white/95 dark:bg-slate-900/95 text-emerald-700 dark:text-emerald-400 rounded-md flex items-center justify-center shadow-2xs border border-stone-200/80 dark:border-slate-800 hover:bg-emerald-600 hover:text-white transition-all bookmark-btn" data-key="media_${item.id}">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="${window.isBookmarked(`media_${item.id}`) ? 'currentColor' : 'none'}" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" /></svg>
                </button>
            </div>
          </div>
          <div class="p-4">
            <h3 class="font-bold text-slate-900 dark:text-white text-xs md:text-sm line-clamp-2 leading-relaxed group-hover:text-emerald-700 dark:group-hover:text-emerald-400 transition-colors">${item.title}</h3>
            <div class="flex items-center justify-between mt-3 pt-2.5 border-t border-stone-100 dark:border-slate-800/80">
                <span class="text-slate-400 text-[11px] font-medium flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    প্লে করুন
                </span>
                <span class="text-xs text-emerald-600 dark:text-emerald-400 group-hover:translate-x-0.5 transition-transform">→</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      renderPagination();
    }

    function renderPagination() {
        paginationContainer.innerHTML = '';
        const totalPages = Math.ceil(filteredItems.length / itemsPerPage);
        if (totalPages <= 1) return;

        for (let i = 1; i <= totalPages; i++) {
            const btn = document.createElement('button');
            btn.innerText = window.toBengaliNumerals ? window.toBengaliNumerals(i) : i;
            btn.className = `w-8 h-8 rounded-lg font-semibold text-xs transition-all ${
                currentPage === i 
                ? 'bg-emerald-600 text-white shadow-xs' 
                : 'bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 hover:bg-stone-50 dark:hover:bg-slate-800 border border-stone-200/80 dark:border-slate-800'
            }`;
            btn.onclick = () => {
                currentPage = i;
                renderMedia();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };
            paginationContainer.appendChild(btn);
        }
    }

    function openModal(item) {
        modalIframe.src = `https://www.youtube.com/embed/${item.id}?autoplay=1`;
        document.getElementById('modal-title').innerText = item.title;
        document.getElementById('modal-category').innerText = item.category === 'prophets' ? 'নবীদের জীবনী' : (item.category === 'quran' ? 'কুরআন তেলাওয়াত' : 'আলোচনা');
        
        modal.classList.remove('pointer-events-none', 'opacity-0');
        modal.classList.add('opacity-100');
        modalContent.classList.remove('scale-95');
        modalContent.classList.add('scale-100');
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        modal.classList.remove('opacity-100');
        modal.classList.add('opacity-0', 'pointer-events-none');
        modalContent.classList.add('scale-95');
        modalContent.classList.remove('scale-100');
        setTimeout(() => { modalIframe.src = ''; }, 300);
        document.body.style.overflow = '';
    }

    function filterMedia(category) {
        currentCategory = category;
        currentPage = 1;
        
        // Update tabs UI
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('bg-primary', 'text-white', 'active-tab');
            btn.classList.add('text-slate-500');
            if (btn.dataset.category === category) {
                btn.classList.add('bg-primary', 'text-white', 'active-tab');
                btn.classList.remove('text-slate-500');
            }
        });

        applyFilters();
    }

    function applyFilters() {
        const query = searchInput.value.toLowerCase().trim();
        filteredItems = mediaItems.filter(item => {
            const matchesCategory = currentCategory === 'all' || item.category === currentCategory;
            const matchesSearch = item.title.toLowerCase().includes(query);
            return matchesCategory && matchesSearch;
        });
        currentPage = 1;
        renderMedia();
    }

    function resetFilters() {
        searchInput.value = '';
        filterMedia('all');
    }

    searchInput.addEventListener('input', applyFilters);

    window.handleMediaBookmark = (event, item) => {
        event.preventDefault();
        event.stopPropagation();
        
        const key = `media_${item.id}`;
        const data = {
            key: key,
            type: 'media',
            id: item.id,
            title: item.title,
            url: `media.html?id=${item.id}`
        };
        
        const isAdded = window.toggleBookmark(data);
        
        document.querySelectorAll(`.bookmark-btn[data-key="${key}"]`).forEach(btn => {
            const svg = btn.querySelector('svg');
            svg.setAttribute('fill', isAdded ? 'currentColor' : 'none');
        });
    };

    // Initial render
    renderMedia();
  </script>
